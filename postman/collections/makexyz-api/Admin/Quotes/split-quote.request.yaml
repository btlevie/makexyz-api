$kind: http-request
name: 'Split Quote'
method: POST
url: '{{base_url}}/admin/quotes/{{quote_uuid}}/split'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "groups": [
        {
          "projectFileUuids": ["{{file_uuid}}"]
        },
        {
          "projectFileUuids": ["{{file_uuid_2}}"]
        }
      ]
    }
