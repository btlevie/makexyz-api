$kind: http-request
name: 'Update Address'
method: PATCH
url: '{{base_url}}/account/addresses/{{address_uuid}}'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "label": "Work",
      "recipientName": "Jane Doe",
      "line1": "456 Market St",
      "city": "San Francisco",
      "state": "CA",
      "postalCode": "94105",
      "country": "US"
    }
