$kind: http-request
name: 'Decline Inquiry'
method: POST
url: '{{base_url}}/vendor/conversations/{{conversation_uuid}}/decline'
order: 1000
description: 'The vendor passes on an open inquiry: it becomes read-only and the customer sees a system message (with the optional reason). 204.'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "We only do SLA resin work"
    }
