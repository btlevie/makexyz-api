$kind: http-request
name: 'PayPal Callback'
method: POST
url: '{{base_url}}/vendor/payout-method/paypal/callback'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "{{paypal_auth_code}}",
      "state": "{{paypal_state}}"
    }
