$kind: collection
name: makexyz API
description: "Backend API for the makexyz manufacturing marketplace. Connects customers with vendors for 3D printing and manufacturing services. Domain lifecycle: Project → Quote → Checkout → Payment → Order → Vendor Acceptance → Production → Shipping → Payout."
variables:
  base_url: http://localhost:3333/v1
  project_uuid: ""
  quote_uuid: ""
  file_uuid: ""
  order_uuid: ""
  address_uuid: ""
  shipment_uuid: ""
  vendor_uuid: ""
  payout_uuid: ""
  project_grant: ""
  paypal_order_id: ""
scripts:
  - type: http:beforeRequest
    code: |-
      // Requests that authorize with an anonymous project grant declare an
      // x-project-grant header. Refuse to send them without a grant, so a
      // missing one fails loudly here instead of as the API's deliberately
      // vague "Project not found" 404.
      const grantHeader = pm.request.headers.get('x-project-grant');
      if (grantHeader !== undefined) {
        const grant = pm.variables.replaceIn(grantHeader);
        if (!grant || /{{.*}}/.test(grant)) {
          throw new Error(
            'x-project-grant is required: project_grant is empty. Run "Upload Instant Quote Files" first to capture one.'
          );
        }
      }
    language: text/javascript
